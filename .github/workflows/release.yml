name: Release

# A tag like v0.1.0 builds, tests and publishes a release with the finished programs.
# Release notes: docs/releases/<tag>.md (if present), otherwise generated by GitHub.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
          - os: ubuntu-latest
            target: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Tag matches the version in Cargo.toml
        shell: bash
        run: grep -q "^version = \"${GITHUB_REF_NAME#v}\"" Cargo.toml || { echo "Tag $GITHUB_REF_NAME does not match Cargo.toml"; exit 1; }
      - name: Linux packages for the GUI
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace
      - run: cargo build --release --workspace
      - name: Package
        shell: bash
        run: |
          DIR="kmp6-rgbtool-${GITHUB_REF_NAME#v}-${{ matrix.target }}"
          mkdir "$DIR"
          cp README.md README.de.md LICENSE "$DIR/"
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp target/release/kmp6_rgbtool.exe target/release/kmp6_rgbtool_gui.exe scripts/windows/*.ps1 "$DIR/"
            7z a "$DIR.zip" "$DIR"
          else
            cp target/release/kmp6_rgbtool target/release/kmp6_rgbtool_gui linux/70-kmp6-rgbtool.rules linux/kmp6-off.service "$DIR/"
            tar czf "$DIR.tar.gz" "$DIR"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: |
            kmp6-rgbtool-*.zip
            kmp6-rgbtool-*.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="docs/releases/$GITHUB_REF_NAME.md"
          if [ -f "$NOTES" ]; then ARGS=(--notes-file "$NOTES"); else ARGS=(--generate-notes); fi
          gh release create "$GITHUB_REF_NAME" dist/* --title "KM-P6 RGB Tool $GITHUB_REF_NAME" "${ARGS[@]}"
